[status-monitor]
average_gpu_load=true

[mini]
cat_color=#FCCF
separator_color=#FCCF
show=CPU+GPU+RAM+TMP+BAT+RES+FPS
show_full_cpu=true
show_full_res=true
show_show_vdd2=true
show_show_vddq=true
spacing=4

[micro]
cat_color=#FCCF
docked_font_size=13
handheld_font_size=13
separator_color=#FCCF
show=CPU+GPU+RAM+TMP+FPS+BAT
show_full_cpu=true
show_full_res=false
text_align=left

[fps-counter]
handheld_font_size=32
docked_font_size=32

[fps-graph]
show_info=true
