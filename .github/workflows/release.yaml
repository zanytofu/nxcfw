name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Set node
        uses: actions/setup-node@v4
        with:
          node-version: latest

      - name: Create release package
        run: |
          cd src
          zip -r ../nxcfw.zip .
          cd ..

      - name: Generate release notes
        run: pnpm dlx changelogithub --assets nxcfw.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
