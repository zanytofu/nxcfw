name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Set node
        uses: actions/setup-node@v4
        with:
          node-version: latest

      - name: Create release package
        run: |
          mkdir -p release-temp

          cp -r SaltySD release-temp/
          cp -r atmosphere release-temp/
          cp -r bootloader release-temp/
          cp -r config release-temp/
          cp -r switch release-temp/
          cp -r exosphere.ini release-temp/
          cp -r hbmenu.nro release-temp/

          cd release-temp
          zip -r ../nxcfw.zip .

          cd ..
          rm -rf release-temp

      - name: Generate Release with changelogithub
        run: pnpm dlx changelogithub --assets nxcfw.zip
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
